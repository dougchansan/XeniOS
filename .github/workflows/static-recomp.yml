name: Static recomp validation
on:
  push:
    branches: [codex/static-recomp]
  pull_request:
    paths:
      - 'src/xenia/cpu/backend/static/**'
      - 'tools/static_recomp/**'
      - '.github/workflows/static-recomp.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: static-recomp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source for reproducible inspection
        run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: static-recomp-source
          path: source.tar.gz
          retention-days: 3
  portable:
    if: false # Enabled when the implementation and test target are committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cmake -S tools/static_recomp -B build-static -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-static --parallel 2
      - run: ctest --test-dir build-static --output-on-failure
