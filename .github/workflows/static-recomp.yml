name: Static recomp validation
on:
  push:
    branches: [codex/static-recomp]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: static-recomp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned public build headers
        run: |
          git submodule update --init --depth=1 -j4 third_party/date third_party/fmt third_party/cxxopts third_party/tomlplusplus third_party/xxhash third_party/rapidjson third_party/utfcpp third_party/disruptorplus third_party/capstone third_party/cereal third_party/imgui third_party/Vulkan-Headers third_party/asio third_party/SDL3
          python3 -m pip install --target tooling clang-format==21.1.8
          tar --exclude='.git' -czf static-build-inputs.tar.gz third_party/date third_party/fmt third_party/cxxopts third_party/tomlplusplus third_party/xxhash third_party/rapidjson third_party/utfcpp third_party/disruptorplus third_party/capstone third_party/cereal third_party/imgui third_party/Vulkan-Headers third_party/asio third_party/SDL3 tooling/clang_format/data/bin/clang-format
      - uses: actions/upload-artifact@v4
        with:
          name: static-build-inputs
          path: static-build-inputs.tar.gz
          retention-days: 3
